<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cifras y Letras</title>
<meta name="description" content="Juego de Cifras y Letras en castellano con las normas del concurso. Para jugar solo o por equipos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECF5; --surface:#FFFFFF; --surface-2:#F3F5FB; --ink:#131F49; --muted:#4B5684;
  --line:#C7CEE3; --line-strong:#6B76A3;
  --letras:#C13229; --letras-ink:#FFFFFF; --letras-soft:#F9DFDB; --letras-text:#B02B22;
  --cifras:#F1B322; --cifras-ink:#131F49; --cifras-soft:#FCEFC9; --cifras-text:#7A5000;
  --studio:#1B2A6B; --studio-ink:#FFFFFF;
  --ok:#1C7448; --ok-soft:#D9F0E3; --bad:#B42318; --bad-soft:#FBE1DE;
  --focus:#2F6BFF;
  --font:"Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-tile:"Archivo", "Arial Black", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1636; --surface:#16224D; --surface-2:#1C2A5C; --ink:#EEF1FA; --muted:#AFB8D8;
    --line:#2E3D75; --line-strong:#7483C2;
    --letras:#C9362D; --letras-ink:#FFFFFF; --letras-soft:#47202B; --letras-text:#FF8F86;
    --cifras:#F4BE3A; --cifras-ink:#131F49; --cifras-soft:#45391A; --cifras-text:#F4BE3A;
    --studio:#3048B0; --studio-ink:#FFFFFF;
    --ok:#5BD08F; --ok-soft:#173D2C; --bad:#FF8A80; --bad-soft:#4A1E26;
    --focus:#8FB0FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1636; --surface:#16224D; --surface-2:#1C2A5C; --ink:#EEF1FA; --muted:#AFB8D8;
  --line:#2E3D75; --line-strong:#7483C2;
  --letras:#C9362D; --letras-ink:#FFFFFF; --letras-soft:#47202B; --letras-text:#FF8F86;
  --cifras:#F4BE3A; --cifras-ink:#131F49; --cifras-soft:#45391A; --cifras-text:#F4BE3A;
  --studio:#3048B0; --studio-ink:#FFFFFF;
  --ok:#5BD08F; --ok-soft:#173D2C; --bad:#FF8A80; --bad-soft:#4A1E26;
  --focus:#8FB0FF; color-scheme:dark;
}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:1.0625rem; line-height:1.5; -webkit-text-size-adjust:100%;}
img,svg{max-width:100%}
button,input{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--focus); outline-offset:3px}
[hidden]{display:none!important}
.sr-only{position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
.skip{position:absolute; left:12px; top:-60px; background:var(--studio); color:var(--studio-ink); padding:10px 14px; border-radius:10px; z-index:10; text-decoration:none; font-weight:700}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}

/* Cabecera */
.top{max-width:780px; margin:0 auto; padding:14px 18px 10px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{margin:0; font-size:1.3rem; font-weight:800; letter-spacing:-.01em; display:flex; align-items:center; gap:6px; line-height:1}
.brand .chip{display:inline-block; padding:7px 10px 8px; border-radius:8px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.brand .c{background:var(--cifras); color:var(--cifras-ink)}
.brand .l{background:var(--letras); color:var(--letras-ink)}
.brand .y{font-weight:500; color:var(--muted); font-size:1.05rem}
.top-actions{margin-left:auto; display:flex; gap:8px}
.scores{list-style:none; margin:0; padding:0 18px 4px; max-width:780px; margin-inline:auto; display:flex; gap:8px; flex-wrap:wrap}
.scores li{display:flex; align-items:baseline; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 12px 5px 14px; font-size:.95rem}
.scores li.turn{border-color:var(--studio); box-shadow:0 0 0 1px var(--studio)}
.scores .p{font-weight:800; font-variant-numeric:tabular-nums; font-size:1.05rem}

main{max-width:780px; margin:0 auto; padding:8px 18px 48px}
main:focus{outline:none}
h2{font-size:1.75rem; line-height:1.15; margin:10px 0 6px; letter-spacing:-.015em}
h2:focus{outline:none}
h3{font-size:1.2rem; margin:24px 0 8px}
p{margin:0 0 12px; max-width:62ch}
.lead{font-size:1.15rem; color:var(--muted)}
.hint{color:var(--muted); font-size:.98rem}

/* Botones */
.btn{appearance:none; border:2px solid transparent; border-radius:12px; min-height:48px; padding:0 20px; font-weight:700; font-size:1.02rem; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--surface); color:var(--ink); border-color:var(--line-strong); text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--studio); color:var(--studio-ink); border-color:var(--studio)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.small{min-height:40px; padding:0 14px; font-size:.95rem}
.btn.danger{background:var(--bad); color:#fff; border-color:var(--bad)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}

/* Formulario de inicio */
fieldset{border:0; padding:0; margin:0 0 22px}
legend{font-weight:800; font-size:1.05rem; margin-bottom:10px; padding:0}
.modes{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px}
.mode input, .seg input{position:absolute; opacity:0; width:1px; height:1px; margin:0}
.mode label{display:block; height:100%; background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer}
.mode label strong{display:block; font-size:1.15rem}
.mode label span{color:var(--muted); font-size:.95rem; display:block; margin-top:2px}
.mode input:checked + label{border-color:var(--studio); box-shadow:inset 0 0 0 2px var(--studio); background:var(--surface-2)}
.mode input:focus-visible + label, .seg input:focus-visible + label{outline:3px solid var(--focus); outline-offset:3px}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg label{display:inline-flex; align-items:center; min-height:44px; padding:6px 16px; background:var(--surface); border:2px solid var(--line); border-radius:999px; cursor:pointer; font-weight:600}
.seg input:checked + label{background:var(--studio); color:var(--studio-ink); border-color:var(--studio)}
.team-list{list-style:none; margin:0 0 10px; padding:0; display:grid; gap:8px}
.team-list li{display:flex; gap:8px; align-items:center}
.team-list input{flex:1; min-width:0}
.field label{display:block; font-weight:700; margin-bottom:6px}
input[type=text]{width:100%; min-height:48px; border:2px solid var(--line-strong); border-radius:12px; background:var(--surface); padding:8px 14px; font-size:1.1rem}
input[type=text]:focus-visible{outline:3px solid var(--focus); outline-offset:1px; border-color:var(--focus)}
.check{display:flex; align-items:center; gap:10px; min-height:44px; font-weight:600; cursor:pointer}
.check input{width:22px; height:22px; accent-color:var(--studio)}
details.rules{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:4px 18px; margin-top:26px}
details.rules summary{cursor:pointer; font-weight:800; min-height:48px; display:flex; align-items:center}
details.rules h3{margin-top:14px}
details.rules ul{padding-left:20px; margin:0 0 12px}
details.rules li{margin-bottom:6px; max-width:62ch}
.status{font-size:.95rem; color:var(--muted); margin-top:14px}

/* Ronda */
.round-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-top:6px}
.round-head h2{margin:0; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.round-head .count{font-size:1rem}
.kind{display:inline-block; font-weight:800; padding:5px 12px 6px; border-radius:8px; font-size:1.05rem}
.kind.l{background:var(--letras); color:var(--letras-ink)}
.kind.c{background:var(--cifras); color:var(--cifras-ink)}
.count{color:var(--muted); font-weight:600}
.turn-msg{font-size:1.2rem; margin:18px 0 12px}
.pick{display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; max-width:440px}
.pick .btn{min-height:64px; font-size:1.6rem; font-weight:800}
.pick + .row{margin-top:12px}

.board{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; margin:16px 0 8px}
@media (max-width:600px){ .board{grid-template-columns:1fr; justify-items:center; gap:12px} }
.clock{position:relative; width:128px; height:128px; flex:none}
@media (max-width:600px){ .clock{width:96px; height:96px} }
.clock svg{width:100%; height:100%; transform:rotate(-90deg); display:block}
.clock .track{fill:var(--surface); stroke:var(--line); stroke-width:10}
.clock .arc{fill:none; stroke-width:10; stroke-linecap:round}
.round-l .clock .arc{stroke:var(--letras)}
.round-c .clock .arc{stroke:var(--cifras)}
.clock .num{position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-family:var(--font-tile); font-size:2.6rem; font-variant-numeric:tabular-nums; line-height:1}
@media (max-width:600px){ .clock .num{font-size:2rem} }
.clock.low .num{color:var(--letras-text)}
.clock.free .num{font-family:var(--font); font-size:1rem; text-align:center; padding:12px; font-weight:700; color:var(--muted)}
.clock-ctl{display:flex; gap:8px; justify-content:center; margin-top:8px}
.clock-col{display:flex; flex-direction:column; align-items:center}

.tiles{list-style:none; margin:0; padding:0; display:grid; gap:8px; width:100%}
.tiles.letters{grid-template-columns:repeat(5, minmax(0,1fr)); max-width:420px}
.tiles.numbers{grid-template-columns:repeat(3, minmax(0,1fr)); max-width:360px}
@media (min-width:601px){ .tiles.letters{grid-template-columns:repeat(5, minmax(0,1fr)); max-width:440px} .tiles.numbers{grid-template-columns:repeat(6, minmax(0,1fr)); max-width:none} }
.tile{appearance:none; position:relative; display:grid; place-items:center; width:100%; aspect-ratio:1/1.08; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; font-weight:800; font-size:clamp(1.5rem, 7vw, 2.1rem); line-height:1; box-shadow:inset 0 -6px 0 var(--acc, var(--letras)); padding:0 0 6px; font-variant-numeric:tabular-nums; user-select:none; font-family:var(--font-tile)}
.tiles.numbers .tile{--acc:var(--cifras); font-size:clamp(1.4rem, 6.5vw, 1.9rem); aspect-ratio:1/.92}
button.tile{cursor:pointer}
button.tile:hover{background:var(--surface-2)}
.tile.used{opacity:.35; box-shadow:inset 0 -6px 0 var(--line)}
.tile.sel{background:var(--cifras-soft); border-color:var(--cifras-text); box-shadow:inset 0 -6px 0 var(--cifras), 0 0 0 2px var(--cifras-text)}
.tile.made{border-style:dashed; border-color:var(--line-strong)}
.tile.deal{animation:deal .32s cubic-bezier(.2,.8,.2,1.2) both}
@keyframes deal{from{transform:rotateX(90deg) translateY(-10px); opacity:0} to{transform:none; opacity:1}}
.target{display:flex; align-items:center; gap:14px; margin-top:12px}
.target .tile{--acc:var(--studio); width:auto; aspect-ratio:auto; min-width:150px; padding:10px 18px 16px; font-size:3rem; background:var(--cifras); color:var(--cifras-ink); border-color:transparent; box-shadow:inset 0 -8px 0 rgba(0,0,0,.2)}
.target span{font-weight:700; color:var(--muted)}
.board-main{width:100%; display:flex; flex-direction:column; align-items:flex-start}
@media (max-width:600px){ .board-main{align-items:center} .target{justify-content:center} }

.answer{margin-top:18px}
.word-row input, input.ans-input{font-family:var(--font-tile)!important; text-transform:uppercase; letter-spacing:.12em; font-weight:800; font-size:1.5rem}
.msg{margin:8px 0 12px; min-height:1.5em; font-weight:600}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--ok)}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin:16px 0}
.panel h3{margin-top:0}

/* Constructor de operaciones */
.builder .b-tiles{margin-bottom:12px}
.ops{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; max-width:360px; margin-bottom:10px}
.ops .btn{min-height:56px; font-size:1.7rem; font-weight:800; padding:0; font-family:var(--font-tile)}
.ops .btn[aria-pressed="true"]{background:var(--studio); color:var(--studio-ink); border-color:var(--studio)}
.expr{font-weight:700; font-size:1.15rem; min-height:1.6em; margin:4px 0 4px; font-variant-numeric:tabular-nums}
.b-err:empty{min-height:0; margin:0}
.steps{margin:0 0 10px; padding-left:24px; font-variant-numeric:tabular-nums; font-size:1.1rem}
.steps li{margin-bottom:2px}
.current{font-weight:700; font-size:1.1rem}

/* Resultados */
.res{width:100%; border-collapse:collapse; margin:6px 0 4px; font-size:1rem}
.res th,.res td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top}
.res th{font-size:.92rem; color:var(--muted); font-weight:700}
.res tbody th{color:var(--ink); font-size:1rem}
.res td.pts{text-align:right; font-weight:800; font-size:1.25rem; font-variant-numeric:tabular-nums; white-space:nowrap}
.res th.pts{text-align:right}
.word{font-family:var(--font-tile); font-weight:800; letter-spacing:.06em; text-transform:uppercase; font-size:1.1rem}
.badge{display:inline-block; font-size:.88rem; font-weight:700; padding:2px 8px; border-radius:6px; margin-top:4px}
.badge.ok{background:var(--ok-soft); color:var(--ok)}
.badge.bad{background:var(--bad-soft); color:var(--bad)}
.badge.neutral{background:var(--surface-2); color:var(--muted)}
.res .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.res .ops-list{margin:4px 0 0; padding-left:18px; color:var(--muted); font-size:.95rem; font-variant-numeric:tabular-nums}
.best-list{list-style:none; padding:0; margin:8px 0 0; display:flex; flex-wrap:wrap; gap:8px}
.best-list a{display:inline-block; font-family:var(--font-tile); font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:8px 12px; border-radius:10px; background:var(--letras-soft); color:var(--ink); text-decoration:none; border:1px solid transparent}
.best-list a:hover{border-color:var(--letras)}
.sol-steps{margin:8px 0; padding-left:24px; font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums}
.link{color:var(--ink); font-weight:700}
.next-row{margin-top:22px}

/* Final */
.ranking{list-style:none; padding:0; margin:12px 0 18px; display:grid; gap:8px}
.ranking li{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 16px}
.ranking .pos{font-weight:800; font-size:1.3rem; width:1.6em; color:var(--muted)}
.ranking .nm{flex:1; font-weight:700; font-size:1.1rem}
.ranking .p{font-weight:800; font-size:1.5rem; font-variant-numeric:tabular-nums}
.ranking li.win{border-color:var(--studio); box-shadow:inset 0 0 0 1px var(--studio)}
.table-wrap{overflow-x:auto; margin:8px 0 18px; border:1px solid var(--line); border-radius:14px; background:var(--surface)}
.hist{border-collapse:collapse; width:100%; font-size:.98rem}
.hist th,.hist td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap}
.hist td.n, .hist th.n{text-align:right; font-variant-numeric:tabular-nums}
.hist tr:last-child td{border-bottom:0}
.hist .tag{font-weight:800; padding:1px 7px; border-radius:6px; font-size:.85rem}
.hist .tag.l{background:var(--letras); color:var(--letras-ink)}
.hist .tag.c{background:var(--cifras); color:var(--cifras-ink)}

dialog{border:0; border-radius:18px; padding:22px; max-width:min(92vw, 420px); background:var(--surface); color:var(--ink); box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,12,30,.55)}
dialog h2{font-size:1.4rem; margin-top:0}

/* Varios móviles */
.room-code{display:flex; gap:8px; margin:14px 0 12px}
.room-code .tile{width:64px; aspect-ratio:1/1.1; font-size:2.2rem; --acc:var(--studio)}
.plist{list-style:none; margin:8px 0 16px; padding:0; display:grid; gap:8px}
.plist li{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px}
.plist .nm{font-weight:700; font-size:1.05rem; margin-right:auto}
.scores li.off{opacity:.55}
.btn[aria-disabled="true"]{opacity:.5}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important}
}
</style>
</head>
<body>
<a class="skip" href="#app">Ir al juego</a>
<header class="top">
  <h1 class="brand"><span class="chip c">Cifras</span><span class="y">y</span><span class="chip l">Letras</span></h1>
  <div class="top-actions"><button type="button" class="btn small" id="quit-btn" hidden>Salir</button></div>
</header>
<ul class="scores" id="scores" aria-label="Marcador" hidden></ul>
<main id="app" tabindex="-1"></main>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="alert" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

<dialog id="dlg-quit" aria-labelledby="dlg-quit-h">
  <form method="dialog">
    <h2 id="dlg-quit-h">¿Salir de la partida?</h2>
    <p id="dlg-quit-p">Se perderá la puntuación de esta partida.</p>
    <div class="row end">
      <button class="btn" value="cancel">Seguir jugando</button>
      <button class="btn danger" value="ok">Salir</button>
    </div>

<script>
'use strict';
/* ================= Utilidades ================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = () => window.matchMedia('(pointer: fine)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function announce(msg, urgent){ const el = urgent ? $('#alert') : $('#live'); el.textContent=''; setTimeout(()=>{ el.textContent = msg; }, 40); }
const ACC = {'á':'a','é':'e','í':'i','ó':'o','ú':'u','ü':'u','à':'a','è':'e','ì':'i','ò':'o','ù':'u','ï':'i','â':'a','ê':'e','î':'i','ô':'o','û':'u'};
function normWord(s){ return s.normalize('NFC').toLowerCase().replace(/\s+/g,'').replace(/[áéíóúüàèìòùïâêîôû]/g, c => ACC[c]); }
const plural = (n, one, many) => n===1 ? one : many;
const fmt = n => n.toLocaleString('es-ES');
const OPWORD = {'+':'más','−':'menos','×':'por','÷':'entre'};
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function restore(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }

/* ================= Sonido ================= */
let audioCtx = null;
function beep(freq=880, dur=0.12, vol=0.12){
  if (!S.settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}

function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }catch(_){} }

/* ================= Diccionario ================= */
const Dict = { set:null, variants:null, promise:null, count:0 };
function loadScript(src){ return new Promise((ok, ko) => { const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
async function gunzip(bytes){
  if ('DecompressionStream' in window){
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js');
  return window.pako.ungzip(bytes, {to:'string'});
}
function loadDict(){
  if (Dict.promise) return Dict.promise;
  Dict.promise = (async () => {
    const b64 = $('#dic-data').textContent.trim();
    const bin = atob(b64); const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    const text = await gunzip(bytes);
    const set = new Set(), variants = new Map();
    let prev = '';
    const lines = text.split('\n');
    for (const ln of lines){
      if (!ln) continue;
      const k = ln.charCodeAt(0) - 48;
      const w = prev.slice(0, k) + ln.slice(1); prev = w;
      const n = w.replace(/[áéíóúü]/g, c => ACC[c]);
      if (n === w){ set.add(n); continue; }
      let e = variants.get(n);
      if (!e){ e = {plain:set.has(n), list:[]}; variants.set(n, e); }
      e.list.push(w); set.add(n);
    }
    Dict.set = set; Dict.variants = variants; Dict.count = set.size;
    return Dict;
  })();
  return Dict.promise;
}
function displayForms(n){
  const e = Dict.variants && Dict.variants.get(n);
  if (!e) return [n];
  return e.plain ? [n, ...e.list] : e.list.slice();
}
const LIDX = c => c === 241 ? 26 : c - 97;
function letterCounts(arr){ const c = new Int8Array(27); for (const ch of arr) c[LIDX(ch.charCodeAt(0))]++; return c; }
function bestWords(letters){
  const base = letterCounts(letters), tmp = new Int8Array(27);
  let best = 0, found = [];
  for (const w of Dict.set){
    const L = w.length;
    if (L < best || L > letters.length) continue;
    tmp.set(base); let ok = true;
    for (let i=0;i<L;i++){ if (--tmp[LIDX(w.charCodeAt(i))] < 0){ ok = false; break; } }
    if (!ok) continue;
    if (L > best){ best = L; found = [w]; } else found.push(w);
  }
  found.sort((a,b) => a.localeCompare(b, 'es'));
  return {len:best, words:found};
}

/* ================= Resolvedor de cifras ================= */
function solveCifras(nums, target){
  const key = a => a.slice().sort((x,y)=>x-y).join(',');
  const seen = new Set(), reach = new Set();
  (function dfs(arr){
    const k = key(arr); if (seen.has(k)) return; seen.add(k);
    for (const v of arr) reach.add(v);
    const n = arr.length; if (n < 2) return;
    for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){
      const a = Math.max(arr[i],arr[j]), b = Math.min(arr[i],arr[j]);
      const rest = []; for (let t=0;t<n;t++) if (t!==i && t!==j) rest.push(arr[t]);
      const res = [a+b];
      if (a!==b) res.push(a-b);
      if (b>1) res.push(a*b);
      if (b>1 && a%b===0) res.push(a/b);
      for (const r of res){ rest.push(r); dfs(rest); rest.pop(); }
    }
  })(nums.slice());
  let best = null, bestD = Infinity;
  for (const v of reach){ const d = Math.abs(v-target); if (d<bestD || (d===bestD && v<best)){ bestD=d; best=v; } }
  for (let depth=0; depth<nums.length; depth++){
    const fail = new Set(), steps = [];
    const found = (function dfs(arr, left){
      if (arr.includes(best)) return true;
      if (left===0) return false;
      const k = key(arr)+'|'+left; if (fail.has(k)) return false;
      const n = arr.length;
      for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){
        const a = Math.max(arr[i],arr[j]), b = Math.min(arr[i],arr[j]);
        const rest = []; for (let t=0;t<n;t++) if (t!==i && t!==j) rest.push(arr[t]);
        const ops = [['+',a+b]];
        if (a!==b) ops.push(['−',a-b]);
        if (b>1) ops.push(['×',a*b]);
        if (b>1 && a%b===0) ops.push(['÷',a/b]);
        for (const [op,r] of ops){
          steps.push({a,b,op,r}); rest.push(r);
          if (dfs(rest,left-1)) return true;
          rest.pop(); steps.pop();
        }
      }
      fail.add(k); return false;
    })(nums.slice(), depth);
    if (found) return { value:best, diff:bestD, steps:pruneSteps(steps, best) };
  }
  return { value:best, diff:bestD, steps:[] };
}
function pruneSteps(steps, best){
  const out = []; const wanted = [best];
  for (let i=steps.length-1;i>=0;i--){
    const s = steps[i], idx = wanted.indexOf(s.r);
    if (idx>=0){ wanted.splice(idx,1); wanted.push(s.a, s.b); out.unshift(s); }
  }
  return out;
}
function solveAsync(nums, target){
  return new Promise(resolve => {
    let done = false;
    const fallback = () => { if (done) return; done = true; setTimeout(() => resolve(solveCifras(nums, target)), 20); };
    try{
      const src = solveCifras.toString() + '\n' + pruneSteps.toString() + '\nonmessage = e => postMessage(solveCifras(e.data.nums, e.data.target));';
      const url = URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
      const w = new Worker(url);
      const t = setTimeout(() => { try{ w.terminate(); }catch(e){} fallback(); }, 9000);
      w.onmessage = e => { clearTimeout(t); try{ w.terminate(); }catch(_){} URL.revokeObjectURL(url); if (!done){ done = true; resolve(e.data); } };
      w.onerror = e => { if (e && e.preventDefault) e.preventDefault(); clearTimeout(t); try{ w.terminate(); }catch(_){} fallback(); };
      w.postMessage({nums, target});
    }catch(e){ fallback(); }
  });
}

/* ================= Sorteos ================= */
const VOWEL_BAG = {a:12, e:12, o:9, i:6, u:5};
const CONS_BAG = {s:6, n:5, r:5, d:5, l:4, t:4, c:4, g:2, b:2, m:2, p:2, h:2, f:1, v:1, y:1, q:1, j:1, 'ñ':1, x:1, z:1};
const bagOf = o => shuffle(Object.entries(o).flatMap(([k,n]) => Array(n).fill(k)));
function drawLetters(vowels){
  const v = bagOf(VOWEL_BAG).slice(0, vowels), c = bagOf(CONS_BAG).slice(0, 10 - vowels);
  return shuffle(v.concat(c));
}
function drawNumbers(){
  const pool = []; for (let i=1;i<=10;i++) pool.push(i, i); pool.push(25, 50, 75, 100);
  shuffle(pool);
  return { nums: pool.slice(0, 6), target: 100 + rnd(900) };
}

/* ================= Reloj ================= */
class Clock{
  constructor(host, seconds, onEnd, opts={}){
    this.host = host; this.total = seconds*1000; this.left = this.total; this.onEnd = onEnd;
    if (opts.left != null) this.left = Math.max(0, Math.min(opts.left, this.total));
    this.running = false; this.done = false; this.lastSec = null; this.raf = null;
    const C = 2*Math.PI*52; this.C = C;
    host.innerHTML = seconds ? `
      <div class="clock" role="timer" aria-label="Tiempo restante">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="arc" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
        <div class="num" aria-hidden="true">${seconds}</div>
        <span class="sr-only sr-time">${seconds} segundos</span>
      </div>
      ${opts.noPause ? '' : '<div class="clock-ctl"><button type="button" class="btn small" data-c="pause">Pausar</button></div>'}` : `
      <div class="clock free"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/></svg><div class="num">Sin límite de tiempo</div></div>`;
    this.arc = $('.arc', host); this.num = $('.num', host); this.srt = $('.sr-time', host); this.box = $('.clock', host);
    const pb = $('[data-c="pause"]', host);
    if (pb) pb.addEventListener('click', () => {
      if (this.running){ this.pause(); pb.textContent = 'Reanudar'; announce('Reloj en pausa'); }
      else if (!this.done){ this.start(); pb.textContent = 'Pausar'; announce('Reloj en marcha'); }
    });
    this.pauseBtn = pb;
    if (opts.left != null && seconds) this.paint(this.left);
  }
  start(){ if (!this.total || this.running || this.done) return; this.running = true; this.t0 = performance.now(); this.loop(); }
  pause(){ if (!this.running) return; this.left -= performance.now() - this.t0; this.running = false; cancelAnimationFrame(this.raf); clearTimeout(this.to); }
  stop(){ this.running = false; this.done = true; cancelAnimationFrame(this.raf); clearTimeout(this.to); if (this.pauseBtn) this.pauseBtn.disabled = true; }
  loop(){
    if (!this.running) return;
    const rem = Math.max(0, this.left - (performance.now() - this.t0));
    this.paint(rem);
    if (rem <= 0){ this.stop(); beep(520, 0.5, 0.18); announce('¡Tiempo!', true); this.onEnd(); return; }
    cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(() => this.loop());
    clearTimeout(this.to); this.to = setTimeout(() => this.loop(), 250); // sigue aunque la pestaña no pinte
  }
  paint(rem){
    const sec = Math.ceil(rem/1000);
    this.arc.setAttribute('stroke-dashoffset', String(this.C * (1 - rem/this.total)));
    if (sec !== this.lastSec){
      this.lastSec = sec; this.num.textContent = sec;
      this.srt.textContent = `${sec} segundos`;
      this.box.classList.toggle('low', sec <= 5);
      if (sec === 10 && this.total > 10000) announce('Quedan 10 segundos');
      if (sec <= 5 && sec > 0) beep(980, 0.07, 0.08);
    }
  }
}

function newGame(){
  const s = S.settings;
  const players = s.mode === 'solo' ? [{name:'Tú', score:0}] : s.teams.map(n => ({name:n, score:0}));
  const plan = [];
  for (let i=0;i<s.rounds;i++) plan.push(s.kind==='letras' ? 'L' : s.kind==='cifras' ? 'C' : (i%2===0 ? 'L' : 'C'));
  S.game = { players, plan, idx:0, history:[], letterTurns:0 };
  $('#quit-btn').hidden = false;
  startRound();
}
function startRound(){
  stopClock();
  const type = S.game.plan[S.game.idx];
  S.round = { type };
  renderScores();
  if (type === 'L') letrasChoose(); else cifrasPrepare();
}

function checkWord(raw, letters){
  const w = normWord(raw);
  if (!w) return {word:'', status:'none', len:0};
  if (/[^a-zñ]/.test(w)) return {word:w, status:'chars', len:w.length};
  const pool = letters.slice(), missing = [];
  for (const ch of w){ const i = pool.indexOf(ch); if (i >= 0) pool.splice(i, 1); else missing.push(ch); }
  if (missing.length) return {word:w, status:'letters', missing, len:w.length};
  if (w.length < 5) return {word:w, status:'short', len:w.length};
  if (!Dict.set.has(w)) return {word:w, status:'dict', len:w.length};
  return {word:w, status:'ok', len:w.length};
}
const dleUrl = w => 'https://dle.rae.es/' + encodeURIComponent(w);
async function letrasResults(raws){
  app.querySelectorAll('#tiles .tile').forEach(t => { if (t.tagName === 'BUTTON') t.disabled = true; });
  const ch = $('#clock-host'); if (ch) ch.innerHTML = '';
  $('#play').innerHTML = `<p class="hint" role="status">Comprobando…</p>`;
  const R = S.round;
  await loadDict();
  if (S.round !== R) return;
  R.answers = raws.map(r => checkWord(r, R.letters));
  R.best = bestWords(R.letters);
  R.recorded = false;
  drawLetrasResults();
}
function letrasPointsOf(answers, solo){
  const valid = answers.map(a => a.status === 'ok' || (a.status === 'dict' && a.override));
  if (solo) return [valid[0] ? answers[0].len : 0];
  const max = Math.max(0, ...answers.map((a, i) => valid[i] ? a.len : 0));
  return answers.map((a, i) => (valid[i] && a.len === max && max > 0) ? max : 0);
}
function letrasPoints(){ return letrasPointsOf(S.round.answers, isSolo()); }
function entryL(answers, pts, best){
  return { type:'L', points: pts, max: best.len >= 5 ? best.len : 0,
    detail: answers.map(a => a.word ? a.word.toUpperCase() : '—'),
    bestTxt: best.len >= 5 ? `${displayForms(best.words[0]).slice(-1)[0].toUpperCase()} (${best.len})` : 'ninguna' };
}
function statusText(a){
  switch (a.status){
    case 'none': return ['neutral', 'Sin respuesta'];
    case 'chars': return ['bad', 'Solo se admiten letras'];
    case 'letters': return ['bad', `Usa letras que no están: ${[...new Set(a.missing)].map(c => c.toUpperCase()).join(', ')}`];
    case 'short': return ['bad', 'Tiene menos de 5 letras'];
    case 'dict': return a.override ? ['ok', `Dada por válida: ${a.len} letras`] : ['bad', 'No está en el diccionario del juego'];
    default: return ['ok', `Válida: ${a.len} letras`];
  }
}
function letrasResultsHtml(players, answers, pts, best, o){
  const rows = answers.map((a, i) => {
    const [cls, txt] = statusText(a);
    const acts = a.status === 'dict'
      ? `<div class="actions"><a class="link" href="${dleUrl(a.word)}" target="_blank" rel="noopener">Buscar «${esc(a.word)}» en el DLE<span class="sr-only"> (se abre en otra pestaña)</span></a>
         ${o.canOverride ? `<button type="button" class="btn small" data-ov="${i}" aria-pressed="${a.override ? 'true' : 'false'}">${a.override ? 'Quitar validez' : 'Dar por válida'}</button>` : ''}</div>` : '';
    return `<tr><th scope="row">${esc(players[i].name)}</th>
      <td><span class="word">${a.word ? esc(a.word) : '—'}</span><br><span class="badge ${cls}">${esc(txt)}</span>${acts}</td>
      <td class="pts">${pts[i]}</td></tr>`;
  }).join('');
  const total = best.count != null ? best.count : best.words.length;
  const bestHtml = best.len >= 5
    ? `<p>Con estas letras se podía llegar a <strong>${best.len} letras</strong>${total > 1 ? ` (${total} palabras posibles)` : ''}:</p>
       <ul class="best-list">${best.words.slice(0, 8).map(w => `<li><a href="${dleUrl(displayForms(w)[displayForms(w).length - 1])}" target="_blank" rel="noopener">${esc(displayForms(w).join(' / '))}<span class="sr-only"> (definición en el DLE, se abre en otra pestaña)</span></a></li>`).join('')}</ul>
       ${total > 8 ? `<p class="hint" style="margin-top:8px">Y ${total - 8} más.</p>` : ''}`
    : `<p>Con estas letras no había ninguna palabra de 5 letras o más en el diccionario.</p>`;
  return `<div class="results">
    <h3 id="res-h" tabindex="-1">Resultado</h3>
    <table class="res"><thead><tr><th scope="col">${o.who}</th><th scope="col">Palabra</th><th scope="col" class="pts">Puntos</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="panel"><h3>La palabra más larga</h3>${bestHtml}</div>
    ${o.footer}</div>`;
}
function drawLetrasResults(focusSel){
  const g = S.game, R = S.round, solo = isSolo();
  const pts = letrasPoints();
  const entry = entryL(R.answers, pts, R.best);
  if (!R.recorded){ g.history.push(entry); R.recorded = true; } else g.history[g.history.length - 1] = entry;
  recomputeScores(); renderScores(solo ? -1 : R.chooser);
  const b = R.best;
  $('#play').innerHTML = letrasResultsHtml(g.players, R.answers, pts, b, { who: solo ? 'Jugador' : 'Equipo', canOverride:true, footer:nextButton() });
  $$('[data-ov]').forEach(btn => btn.addEventListener('click', () => {
    const a = R.answers[+btn.dataset.ov]; a.override = !a.override;
    drawLetrasResults(`[data-ov="${btn.dataset.ov}"]`);
    announce(a.override ? `«${a.word}» dada por válida.` : `«${a.word}» vuelve a no ser válida.`);
  }));
  bindNext();
  if (focusSel){ const el = $(focusSel); if (el) el.focus(); }
  else {
    $('#res-h').focus();
    const sum = solo ? `Has sumado ${pts[0]} ${plural(pts[0], 'punto', 'puntos')}.` : resumenEquipos(pts);
    announce(`${sum} La palabra más larga posible tenía ${b.len} letras.`);
  }
}
function resumenEquipos(pts){
  const g = S.game, max = Math.max(...pts);
  if (max <= 0) return 'Nadie puntúa en esta prueba.';
  const w = g.players.filter((_, i) => pts[i] === max).map(p => p.name);
  return `${w.join(' y ')} ${w.length > 1 ? 'suman' : 'suma'} ${max} puntos.`;
}

function Builder(host, nums, target, opts={}){
  const tiles = nums.map((v, i) => ({id:i, v, used:false, made:false}));
  const steps = []; let sel = null, op = null, nextId = nums.length;
  host.innerHTML = `<div class="builder">
    <p class="hint" id="b-help">Elige un número, una operación y otro número. El resultado aparece como un número nuevo.</p>
    <ul class="tiles numbers b-tiles" aria-label="Números disponibles" aria-describedby="b-help"></ul>
    <div class="ops" role="group" aria-label="Operaciones">
      <button type="button" class="btn" data-op="+" aria-label="Sumar" aria-pressed="false">+</button>
      <button type="button" class="btn" data-op="−" aria-label="Restar" aria-pressed="false">−</button>
      <button type="button" class="btn" data-op="×" aria-label="Multiplicar" aria-pressed="false">×</button>
      <button type="button" class="btn" data-op="÷" aria-label="Dividir" aria-pressed="false">÷</button>
    </div>
    <p class="expr" aria-hidden="true"></p>
    <p class="msg bad b-err" role="alert"></p>
    <ol class="steps" aria-label="Operaciones hechas"></ol>
    <div class="row"><button type="button" class="btn small" data-act="undo">Deshacer</button><button type="button" class="btn small" data-act="reset">Empezar de nuevo</button></div>
    <p class="current" style="margin-top:12px"></p>
  </div>`;
  const tUl = $('.b-tiles', host), err = $('.b-err', host), expr = $('.expr', host), stepsOl = $('.steps', host), cur = $('.current', host);
  const byId = id => tiles.find(t => t.id === id);
  const answer = () => {
    const av = tiles.filter(t => !t.used);
    let best = null;
    for (const t of av){ const d = Math.abs(t.v - target); if (!best || d < best.diff || (d === best.diff && t.made && !best.made)) best = {value:t.v, diff:d, made:t.made}; }
    return best ? {value:best.value, diff:best.diff, steps:steps.map(s => ({a:s.a, b:s.b, op:s.op, r:s.r}))} : null;
  };
  const draw = (focusId) => {
    tUl.innerHTML = tiles.map(t => `<li><button type="button" class="tile${t.used ? ' used' : ''}${t.made ? ' made' : ''}${sel === t.id ? ' sel' : ''}" data-id="${t.id}" ${t.used ? 'disabled' : ''} aria-pressed="${sel === t.id}" aria-label="${t.v}${t.made ? ', resultado' : ''}">${t.v}</button></li>`).join('');
    $$('[data-op]', host).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.op === op)));
    expr.textContent = sel !== null ? `${byId(sel).v} ${op || ''}` : '';
    stepsOl.innerHTML = steps.map(s => `<li>${s.a} ${s.op} ${s.b} = <strong>${s.r}</strong></li>`).join('');
    const a = answer();
    cur.textContent = a ? `${opts.who || 'Tu resultado'}: ${a.value}${a.diff === 0 ? ', ¡exacto!' : `, a ${a.diff} del objetivo`}` : '';
    if (focusId !== undefined){ const b = $(`[data-id="${focusId}"]`, tUl); if (b && !b.disabled) b.focus(); }
    if (opts.onChange) opts.onChange(a);
  };
  tUl.addEventListener('click', e => {
    const b = e.target.closest('[data-id]'); if (!b || b.disabled) return;
    const id = +b.dataset.id; err.textContent = '';
    if (sel === null){ sel = id; draw(id); return; }
    if (sel === id){ sel = null; op = null; draw(id); return; }
    if (!op){ sel = id; draw(id); return; }
    const A = byId(sel), B = byId(id); let r = null;
    if (op === '+') r = A.v + B.v;
    else if (op === '×') r = A.v * B.v;
    else if (op === '−'){ if (A.v <= B.v){ err.textContent = 'La resta tiene que dar un número positivo: pon primero el número mayor.'; return; } r = A.v - B.v; }
    else { if (A.v % B.v !== 0){ err.textContent = `La división tiene que ser exacta: ${A.v} entre ${B.v} no lo es.`; return; } r = A.v / B.v; }
    A.used = true; B.used = true;
    const nt = {id:nextId++, v:r, used:false, made:true}; tiles.push(nt);
    steps.push({a:A.v, b:B.v, op, r, ids:[A.id, B.id, nt.id]});
    announce(`${A.v} ${OPWORD[op]} ${B.v} igual a ${r}${r === target ? '. ¡Exacto!' : ''}`);
    if (r === target) beep(1200, 0.18, 0.12);
    sel = null; op = null; draw(nt.id);
  });
  $$('[data-op]', host).forEach(b => b.addEventListener('click', () => {
    err.textContent = '';
    if (sel === null){ err.textContent = 'Elige primero un número.'; return; }
    op = op === b.dataset.op ? null : b.dataset.op; draw();
  }));
  $('[data-act="undo"]', host).addEventListener('click', () => {
    err.textContent = ''; const s = steps.pop(); if (!s) return;
    const [a, b2, n] = s.ids; tiles.splice(tiles.findIndex(t => t.id === n), 1);
    byId(a).used = false; byId(b2).used = false; sel = null; op = null; draw();
    announce(`Deshecho: ${s.a} ${OPWORD[s.op]} ${s.b}`);
  });
  $('[data-act="reset"]', host).addEventListener('click', () => {
    err.textContent = ''; steps.length = 0;
    for (let i = tiles.length - 1; i >= 0; i--) if (tiles[i].made) tiles.splice(i, 1);
    tiles.forEach(t => t.used = false); sel = null; op = null; draw(); announce('Operaciones borradas');
  });
  draw();
  return { answer, disable(){ $$('button', host).forEach(b => b.disabled = true); } };
}

      <button type="button" class="btn" id="none">No tenemos resultado</button>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="ok">Confirmar resultado</button>
    </div></div>`;
  $('#tiles').hidden = true;
  const bl = Builder($('#b-host'), R.nums, R.target, {who:'Vuestro resultado'});
  $('#ok').addEventListener('click', () => cifrasTeamAnswer(i + 1, acc.concat([bl.answer()])));
  $('#none').addEventListener('click', () => cifrasTeamAnswer(i + 1, acc.concat([null])));
  $('#turn-h').focus();
}
function cifrasPointsOf(answers, sol, solo){
  if (solo){
    const a = answers[0];
    return [!a ? 0 : a.diff === 0 ? 10 : (a.diff <= 10 || a.diff === sol.diff) ? 7 : 0];
  }
  const diffs = answers.map(a => a ? a.diff : Infinity);
  const min = Math.min(...diffs);
  return diffs.map(d => d === Infinity ? 0 : d === 0 ? 10 : (min > 0 && d === min ? 7 : 0));
}
function entryC(R, answers, pts, sol){
  return { type:'C', points:pts, max: sol.diff === 0 ? 10 : 7,
    detail: answers.map(a => a ? `${a.value}${a.diff ? ` (a ${a.diff})` : ''}` : '—'),
    bestTxt: sol.diff === 0 ? `${R.target} exacto` : `${sol.value} (a ${sol.diff})` };
}
function cifrasResultsHtml(players, answers, pts, sol, target, o){
  const rows = answers.map((a, i) => {
    let badge;
    if (!a) badge = ['neutral', 'Sin resultado'];
    else if (a.diff === 0) badge = ['ok', 'Exacto'];
    else badge = [pts[i] ? 'ok' : 'neutral', `A ${a.diff} del objetivo`];
    const ops = a && a.steps.length ? `<ol class="ops-list">${a.steps.map(s => `<li>${s.a} ${s.op} ${s.b} = ${s.r}</li>`).join('')}</ol>` : '';
    return `<tr><th scope="row">${esc(players[i].name)}</th><td><span class="word">${a ? a.value : '—'}</span><br><span class="badge ${badge[0]}">${badge[1]}</span>${ops}</td><td class="pts">${pts[i]}</td></tr>`;
  }).join('');
  const solHtml = sol.steps.length
    ? `<ol class="sol-steps">${sol.steps.map(s => `<li>${s.a} ${s.op} ${s.b} = ${s.r}</li>`).join('')}</ol>`
    : `<p>Ya estaba entre los números: <strong>${sol.value}</strong>.</p>`;
  return `<div class="results">
    <h3 id="res-h" tabindex="-1">Resultado</h3>
    <table class="res"><thead><tr><th scope="col">${o.who}</th><th scope="col">Resultado</th><th scope="col" class="pts">Puntos</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="panel"><h3>${sol.diff === 0 ? `Así se llega a ${target}` : `El ${target} no se podía conseguir`}</h3>
      ${sol.diff === 0 ? '' : `<p>Lo más cerca posible era <strong>${sol.value}</strong>, a ${sol.diff} del objetivo:</p>`}
      ${solHtml}
      <p class="hint">Es la solución con menos operaciones; puede haber otras.</p></div>
    ${o.footer}</div>`;
}
async function cifrasResults(answers){
  const g = S.game, R = S.round, solo = isSolo();
  $('#clock-host').innerHTML = '';
  $('#tiles').hidden = false;
  $('#play').innerHTML = `<p class="hint" role="status">Calculando la mejor solución…</p>`;
  const sol = await R.solution;
  if (S.round !== R) return;
  const pts = cifrasPointsOf(answers, sol, solo);
  g.history.push(entryC(R, answers, pts, sol));
  recomputeScores(); renderScores(-1);
  $('#play').innerHTML = cifrasResultsHtml(g.players, answers, pts, sol, R.target, { who: solo ? 'Jugador' : 'Equipo', footer:nextButton() });
  bindNext();
  $('#res-h').focus();
  const sum = solo ? `Has sumado ${pts[0]} ${plural(pts[0], 'punto', 'puntos')}.` : resumenEquipos(pts);
  announce(`${sum} ${sol.diff === 0 ? 'La cifra exacta era posible.' : `Lo más cerca posible era ${sol.value}.`}`);
}

/* ================= Final ================= */
function finalHtml(g, actions){
  const solo = g.players.length === 1;
  const order = g.players.map((p, i) => ({...p, i})).sort((a, b) => b.score - a.score);
  const top = order[0].score, winners = order.filter(p => p.score === top);
  const maxPossible = g.history.reduce((s, h) => s + h.max, 0);
  let headline;
  if (solo) headline = `Has hecho ${top} ${plural(top, 'punto', 'puntos')} en ${g.history.length} pruebas.`;
  else if (winners.length > 1) headline = `Empate a ${top} puntos entre ${winners.map(w => w.name).join(' y ')}.`;
  else headline = `Gana ${winners[0].name} con ${top} puntos.`;
  let pos = 0, last = null;
  const ranking = order.map((p, k) => { if (p.score !== last){ pos = k + 1; last = p.score; }
    return `<li class="${p.score === top ? 'win' : ''}"><span class="pos">${pos}.º</span><span class="nm">${esc(p.name)}</span><span class="p">${p.score}</span><span class="sr-only"> puntos</span></li>`; }).join('');
  const head = g.players.map(p => `<th scope="col" class="n">${esc(p.name)}</th>`).join('');
  const rows = g.history.map((h, k) => `<tr><th scope="row"><span class="tag ${h.type === 'L' ? 'l' : 'c'}">${h.type === 'L' ? 'Letras' : 'Cifras'}</span> ${k + 1}</th>
    ${solo ? `<td>${esc(h.detail[0])}</td><td>${esc(h.bestTxt)}</td>` : ''}${h.points.map(p => `<td class="n">${p}</td>`).join('')}</tr>`).join('');
  const html = `<section aria-labelledby="h-final">
    <h2 id="h-final">Final de la partida</h2>
    <p class="lead">${esc(headline)}</p>
    ${solo ? `<p class="hint">El máximo posible con estas tiradas era ${maxPossible} puntos.</p>` : `<ol class="ranking" aria-label="Clasificación">${ranking}</ol>`}
    <h3>Prueba a prueba</h3>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Puntos por prueba"><table class="hist">
      <thead><tr><th scope="col">Prueba</th>${solo ? '<th scope="col">Tu respuesta</th><th scope="col">Lo mejor posible</th>' : ''}${solo ? '<th scope="col" class="n">Puntos</th>' : head}</tr></thead><tbody>${rows}</tbody></table></div>
    ${actions}
  </section>`;
  return { html, headline };
}
function renderFinal(){
  stopClock();
  const g = S.game;
  recomputeScores(); renderScores(-1);
  const { html, headline } = finalHtml(g, `<div class="row"><button type="button" class="btn primary" id="again">Jugar otra vez</button><button type="button" class="btn" id="setup">Cambiar ajustes</button></div>`);
  app.innerHTML = html;
  $('#again').addEventListener('click', newGame);
  $('#setup').addEventListener('click', renderSetup);
  $('#quit-btn').hidden = true;
  focusHeading();
  announce(headline);
}


/* ================= Varios móviles: conexión directa entre móviles (WebRTC con PeerJS) ================= */
const PEER_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
const ROOM_PREFIX = 'cifras-letras-';
const CODE_CHARS = 'BCDFGHJKMNPRSTVXZ';
const MAX_PLAYERS = 8, GRACE_MS = 3500;
const O = { role:null, peer:null, conn:null, code:'', name:'', me:-1, P:null, screen:'', leaving:false, wake:null, focusSel:null };
let H = null; // estado del anfitrión: es quien reparte, comprueba y puntúa

function hashCode(){ const m = /#sala=([A-Za-z]{4})/.exec(location.hash); return m ? m[1].toUpperCase() : null; }
function roomLink(code){ return location.href.split('#')[0] + '#sala=' + code; }
function newCode(){ let c = ''; for (let i = 0; i < 4; i++) c += CODE_CHARS[rnd(CODE_CHARS.length)]; return c; }
function peerOptions(){
  const q = new URLSearchParams(location.search), o = { debug:0 };
  if (q.get('peerhost')){ o.host = q.get('peerhost'); o.port = +(q.get('peerport') || 9000); o.path = q.get('peerpath') || '/'; o.secure = q.get('peersecure') === '1'; }
  return o;
}
async function loadPeerLib(){ if (window.Peer) return; await loadScript(PEER_SRC); if (!window.Peer) throw new Error('Peer'); }
async function requestWake(){
  try{ if ('wakeLock' in navigator && !O.wake){ O.wake = await navigator.wakeLock.request('screen'); O.wake.addEventListener('release', () => { O.wake = null; }); } }catch(_){}
}
function releaseWake(){ try{ if (O.wake) O.wake.release(); }catch(_){} O.wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.online) requestWake(); });

function secsFor(type){
  const t = H.settings.time;
  if (t === 'libre') return 0;
  return (type === 'L' ? 30 : 40) * (t === 'doble' ? 2 : 1);
}
function onlineSend(m){
  if (O.role === 'host'){ if (H) hostMsg(0, m); return; }
  try{ if (O.conn && O.conn.open) O.conn.send(m); }catch(_){}
}

/* ---------- Pantallas de estado ---------- */
function onlineConnecting(text){
  stopClock(); S.game = null; renderScores();
  app.innerHTML = `<section aria-labelledby="h-conn"><h2 id="h-conn">Sala</h2><p class="lead" role="status">${esc(text)}</p></section>`;
  focusHeading();
}
function onlineTeardown(){
  O.leaving = true; releaseWake();
  if (H){ clearTimeout(H.timer); H.conns.forEach(c => { try{ if (c) c.close(); }catch(_){} }); }
  try{ if (O.conn) O.conn.close(); }catch(_){}
  try{ if (O.peer) O.peer.destroy(); }catch(_){}
  O.peer = null; O.conn = null; O.P = null; O.screen = '';
}
function onlineLeave(){
  onlineTeardown(); H = null; O.role = null; S.online = false; S.game = null; S.round = null;
  if (hashCode()) history.replaceState(null, '', location.pathname + location.search);
}
function onlineFail(msg, retry, title){
  onlineTeardown(); stopClock(); S.game = null; renderScores(); $('#quit-btn').hidden = true;
  app.innerHTML = `<section aria-labelledby="h-fail"><h2 id="h-fail">${esc(title || 'No se ha podido conectar')}</h2><p class="lead">${esc(msg)}</p>
    <div class="row">${retry ? '<button type="button" class="btn primary" id="o-retry">Volver a intentarlo</button>' : ''}<button type="button" class="btn" id="o-back">Volver al inicio</button></div></section>`;
  if (retry) $('#o-retry').addEventListener('click', () => O.role === 'host' ? onlineHost(O.name) : onlineJoin(O.code, O.name));
  $('#o-back').addEventListener('click', () => { onlineLeave(); renderSetup(); });
  focusHeading(); announce(msg, true);
}
function onlineLost(){
  stopClock(); releaseWake();
  app.innerHTML = `<section aria-labelledby="h-lost"><h2 id="h-lost">Conexión perdida</h2>
    <p class="lead">Has perdido la conexión con la sala ${esc(O.code)}. Si la partida sigue en marcha, puedes volver a entrar con el mismo nombre y continuarás donde estabas.</p>
    <div class="row"><button type="button" class="btn primary" id="o-retry">Volver a conectar</button><button type="button" class="btn" id="o-back">Salir</button></div></section>`;
  $('#o-retry').addEventListener('click', () => onlineJoin(O.code, O.name));
  $('#o-back').addEventListener('click', () => { onlineLeave(); renderSetup(); });
  focusHeading(); announce('Conexión perdida con la sala.', true);
}

/* ---------- Anfitrión ---------- */
async function onlineHost(name){
  onlineTeardown();
  S.online = true; O.role = 'host'; O.name = name; O.leaving = false;
  $('#quit-btn').hidden = false;
  onlineConnecting('Creando la sala…');
  try{ await Promise.all([loadPeerLib(), loadDict()]); }
  catch(e){ return onlineFail('No se ha podido cargar el servicio de conexión. Comprueba tu conexión a internet.', true, 'No se ha podido crear la sala'); }
  const s = S.settings, plan = [];
  for (let i = 0; i < s.rounds; i++) plan.push(s.kind === 'letras' ? 'L' : s.kind === 'cifras' ? 'C' : (i % 2 === 0 ? 'L' : 'C'));
  H = { settings:{ rounds:s.rounds, kind:s.kind, time:s.time }, players:[{ name, connected:true, score:0 }], conns:[null],
        phase:'lobby', plan, idx:0, history:[], turns:0, chooser:0, round:null, answers:[], submitted:[], results:null, rv:0, timer:null, solution:null, finishing:false, code:'' };
  openHostPeer(0);
}
function openHostPeer(attempt){
  const code = newCode();
  let opened = false;
  const peer = new Peer(ROOM_PREFIX + code, peerOptions());
  O.peer = peer;
  const fail = (msg) => { clearTimeout(to); onlineFail(msg, true, 'No se ha podido crear la sala'); };
  const to = setTimeout(() => { if (!opened) fail('No se puede contactar con el servicio de salas. Si has abierto el juego dentro de Claude, este modo no funciona ahí: hay que alojarlo en tu propia página.'); }, 12000);
  peer.on('open', () => { opened = true; clearTimeout(to); O.code = code; H.code = code; requestWake(); hostBroadcast(); });
  peer.on('connection', conn => hostAccept(conn));
  peer.on('error', err => {
    if (O.leaving) return;
    if (!opened && err.type === 'unavailable-id' && attempt < 5){ clearTimeout(to); try{ peer.destroy(); }catch(_){} openHostPeer(attempt + 1); return; }
    if (!opened) fail('No se ha podido crear la sala (' + err.type + ').');
    else announce('Problema de conexión con el servicio de salas.', true);
  });
  peer.on('disconnected', () => { if (!O.leaving && opened){ try{ peer.reconnect(); }catch(_){} } });
}
function hostState(){
  const R = H.round;
  return {
    phase:H.phase, code:H.code, settings:H.settings, plan:H.plan, idx:H.idx, chooser:H.chooser, rv:H.rv,
    players:H.players.map(p => ({ name:p.name, connected:p.connected, score:p.score })),
    submitted:H.submitted.slice(),
    round: R ? { type:R.type, letters:R.letters, vowels:R.vowels, nums:R.nums, target:R.target, secs:R.secs, remaining: R.deadlineAt ? Math.max(0, R.deadlineAt - Date.now()) : 0 } : null,
    results: H.phase === 'results' ? H.results : null,
    history:H.history,
    screen: `${H.phase}|${H.idx}|${H.rv}|${H.phase === 'choose' ? H.chooser : ''}|${H.phase === 'lobby' ? H.players.map(p => p.connected ? 1 : 0).join('') : ''}`
  };
}
function hostBroadcast(){
  if (!H || !O.code) return;
  const st = hostState();
  H.conns.forEach(c => { try{ if (c && c.open) c.send({ t:'state', s:st }); }catch(_){} });
  onlineRender(st);
}
function hostAccept(conn){
  conn.on('data', d => hostData(conn, d));
  conn.on('close', () => hostDrop(conn));
  conn.on('error', () => hostDrop(conn));
}
function hostData(conn, d){
  if (!H || !d || typeof d !== 'object') return;
  if (d.t === 'hello') return hostHello(conn, String(d.name || ''));
  const i = H.conns.indexOf(conn);
  if (i > 0) hostMsg(i, d);
}
function hostReject(conn, why){
  try{ conn.send({ t:'reject', why }); }catch(_){}
  setTimeout(() => { try{ conn.close(); }catch(_){} }, 400);
}
function hostHello(conn, raw){
  const name = raw.trim().replace(/\s+/g, ' ').slice(0, 20);
  if (!name) return hostReject(conn, 'name');
  const low = name.toLowerCase();
  const i = H.players.findIndex(p => p.name.toLowerCase() === low);
  if (i === 0) return hostReject(conn, 'taken');
  if (i > 0){
    const old = H.conns[i];
    const alive = old && old !== conn && old.open && H.players[i].connected;
    if (alive && H.phase === 'lobby') return hostReject(conn, 'taken');
    if (old && old !== conn){ try{ old.close(); }catch(_){} }
    H.conns[i] = conn; H.players[i].connected = true;
    announce(`${name} ha vuelto a la sala.`);
    return hostBroadcast();
  }
  if (H.phase !== 'lobby') return hostReject(conn, 'started');
  if (H.players.length >= MAX_PLAYERS) return hostReject(conn, 'full');
  H.players.push({ name, connected:true, score:0 }); H.conns.push(conn);
  announce(`${name} se ha unido a la sala.`);
  hostBroadcast();
}
function hostDrop(conn){
  if (!H) return;
  const i = H.conns.indexOf(conn);
  if (i <= 0) return;
  H.conns[i] = null; H.players[i].connected = false;
  announce(`${H.players[i].name} se ha desconectado.`);
  if (H.phase === 'play' && H.players.every((p, j) => !p.connected || H.submitted[j])) hostFinish();
  else hostBroadcast();
}
function hostMsg(i, d){
  switch (d.t){
    case 'vowels': return hostVowels(i, +d.n);
    case 'answer': return hostAnswer(i, d);
    case 'start': if (i === 0) hostStart(); return;
    case 'force': if (i === 0) hostFinish(); return;
    case 'override': if (i === 0) hostOverride(+d.i); return;
    case 'next': if (i === 0) hostNext(); return;
    case 'restart': if (i === 0) hostRestart(); return;
  }
}
function hostStart(){
  if (H.phase !== 'lobby' || H.players.filter(p => p.connected).length < 2) return;
  const keep = H.players.map(p => p.connected);
  H.players = H.players.filter((_, k) => keep[k]); H.conns = H.conns.filter((_, k) => keep[k]);
  H.idx = 0; H.turns = 0; H.history = []; hostRecompute();
  hostStartRound();
}
function hostStartRound(){
  clearTimeout(H.timer);
  H.rv = 0; H.results = null; H.finishing = false; H.solution = null;
  H.submitted = H.players.map(() => false); H.answers = H.players.map(() => null);
  const type = H.plan[H.idx];
  H.round = { type };
  if (type === 'L'){
    let k = H.turns % H.players.length, guard = 0;
    while (!H.players[k].connected && guard++ < H.players.length){ H.turns++; k = H.turns % H.players.length; }
    H.chooser = k; H.phase = 'choose';
  } else {
    const { nums, target } = drawNumbers();
    Object.assign(H.round, { nums, target });
    H.solution = solveAsync(nums, target);
    hostDeal();
  }
  hostBroadcast();
}
function hostDeal(){
  const R = H.round, secs = secsFor(R.type), allow = R.type === 'L' ? 1500 : 2300;
  R.secs = secs;
  R.deadlineAt = secs ? Date.now() + allow + secs * 1000 : 0;
  H.phase = 'play';
  clearTimeout(H.timer);
  if (secs) H.timer = setTimeout(hostFinish, allow + secs * 1000 + GRACE_MS);
}
function hostVowels(i, n){
  if (H.phase !== 'choose' || !(n >= 3 && n <= 6)) return;
  if (!(i === H.chooser || (i === 0 && !H.players[H.chooser].connected))) return;
  H.turns++;
  H.round.vowels = n; H.round.letters = drawLetters(n);
  hostDeal(); hostBroadcast();
}
function verifyAnswer(nums, target, ans){
  if (!ans || !Array.isArray(ans.steps) || ans.steps.length > 5) return null;
  const pool = nums.slice(), steps = [];
  for (const s of ans.steps){
    const a = +s.a, b = +s.b, op = s.op;
    if (!Number.isInteger(a) || !Number.isInteger(b)) return null;
    const ia = pool.indexOf(a); if (ia < 0) return null; pool.splice(ia, 1);
    const ib = pool.indexOf(b); if (ib < 0) return null; pool.splice(ib, 1);
    let r;
    if (op === '+') r = a + b;
    else if (op === '×') r = a * b;
    else if (op === '−'){ if (a <= b) return null; r = a - b; }
    else if (op === '÷'){ if (b === 0 || a % b !== 0) return null; r = a / b; }
    else return null;
    if (!(r > 0) || !Number.isInteger(r)) return null;
    pool.push(r); steps.push({ a, b, op, r });
  }
  let best = null;
  for (const v of pool){ const d = Math.abs(v - target); if (!best || d < best.diff) best = { value:v, diff:d }; }
  const pref = +ans.value;
  if (pool.includes(pref) && Math.abs(pref - target) === best.diff) best.value = pref;
  return { value:best.value, diff:best.diff, steps };
}
function hostAnswer(i, d){
  if (H.phase !== 'play' || H.submitted[i]) return;
  const R = H.round;
  if (R.type === 'L'){ if (d.k !== 'L') return; H.answers[i] = String(d.word || '').slice(0, 30); }
  else { if (d.k !== 'C') return; H.answers[i] = verifyAnswer(R.nums, R.target, d.ans); }
  H.submitted[i] = true;
  if (H.players.every((p, j) => !p.connected || H.submitted[j])) hostFinish(); else hostBroadcast();
}
function hostRecompute(){
  H.players.forEach((p, i) => { p.score = H.history.reduce((s, h) => s + (h.points[i] || 0), 0); });
}
async function hostFinish(){
  const h = H;
  if (!h || h.phase !== 'play' || h.finishing) return;
  h.finishing = true; clearTimeout(h.timer);
  const R = h.round;
  if (R.type === 'L'){
    await loadDict();
    if (H !== h) return;
    const answers = h.players.map((_, i) => checkWord(h.answers[i] || '', R.letters));
    const best = bestWords(R.letters);
    const pts = letrasPointsOf(answers, false);
    h.results = { answers, pts, best:{ len:best.len, count:best.words.length, words:best.words.slice(0, 40) } };
    h.history.push(entryL(answers, pts, h.results.best));
  } else {
    const sol = await h.solution;
    if (H !== h) return;
    const answers = h.answers.slice();
    const pts = cifrasPointsOf(answers, sol, false);
    h.results = { answers, pts, sol };
    h.history.push(entryC(R, answers, pts, sol));
  }
  hostRecompute();
  h.phase = 'results'; h.rv++;
  hostBroadcast();
}
function hostOverride(i){
  if (H.phase !== 'results' || H.round.type !== 'L') return;
  const a = H.results.answers[i];
  if (!a || a.status !== 'dict') return;
  a.override = !a.override;
  H.results.pts = letrasPointsOf(H.results.answers, false);
  H.history[H.history.length - 1] = entryL(H.results.answers, H.results.pts, H.results.best);
  hostRecompute(); H.rv++;
  hostBroadcast();
}
function hostNext(){
  if (H.phase !== 'results') return;
  if (H.idx >= H.plan.length - 1){ H.phase = 'final'; H.rv++; hostRecompute(); hostBroadcast(); }
  else { H.idx++; hostStartRound(); }
}
function hostRestart(){
  if (H.phase !== 'final') return;
  clearTimeout(H.timer);
  H.phase = 'lobby'; H.idx = 0; H.turns = 0; H.history = []; H.round = null; H.results = null; H.rv++;
  hostRecompute(); hostBroadcast();
}

/* ---------- Invitado ---------- */
function rejectText(why){
  return why === 'taken' || why === 'name' ? 'Ya hay alguien con ese nombre en la sala. Vuelve al inicio y prueba con otro.'
    : why === 'started' ? 'La partida ya ha empezado y ese nombre no estaba en ella. Para volver a entrar usa el mismo nombre de antes.'
    : why === 'full' ? `La sala está llena (${MAX_PLAYERS} jugadores).` : 'La sala no te ha dejado entrar.';
}
async function onlineJoin(code, name){
  onlineTeardown();
  S.online = true; O.role = 'guest'; O.name = name; O.code = code; O.leaving = false;
  $('#quit-btn').hidden = false;
  onlineConnecting(`Conectando con la sala ${code}…`);
  try{ await loadPeerLib(); }
  catch(e){ return onlineFail('No se ha podido cargar el servicio de conexión. Comprueba tu conexión a internet.', true); }
  loadDict().catch(() => {});
  let got = false;
  const peer = new Peer(undefined, peerOptions());
  O.peer = peer;
  const to = setTimeout(() => { if (!got && !O.leaving) onlineFail('No se ha podido conectar con la sala. Comprueba el código y que el anfitrión tenga el juego abierto. Si no estáis en la misma wifi, la conexión puede fallar.', true); }, 15000);
  peer.on('error', err => {
    if (O.leaving) return;
    clearTimeout(to);
    if (err.type === 'peer-unavailable') onlineFail(`No existe ninguna sala con el código ${code}.`, true);
    else if (!got) onlineFail(`No se ha podido conectar (${err.type}).`, true);
    else onlineLost();
  });
  peer.on('open', () => {
    const conn = peer.connect(ROOM_PREFIX + code, { reliable:true, serialization:'json' });
    O.conn = conn;
    conn.on('open', () => conn.send({ t:'hello', name }));
    conn.on('data', d => {
      if (!d || O.leaving) return;
      if (d.t === 'state'){ got = true; clearTimeout(to); onlineRender(d.s); }
      else if (d.t === 'reject'){ got = true; clearTimeout(to); onlineFail(rejectText(d.why), false, 'No se ha podido entrar'); }
    });
    conn.on('close', () => { clearTimeout(to); if (!O.leaving) onlineLost(); });
  });
}

/* ---------- Pantallas de la partida (iguales para todos) ---------- */
function waitingNames(P){
  const names = P.players.filter((p, i) => p.connected && !P.submitted[i]).map(p => p.name);
  return names.length ? `Esperando a: ${names.join(', ')}.` : 'Todos han respondido.';
}
function onlineRender(P){
  const prevScreen = O.screen, first = !O.P;
  O.P = P;
  O.me = O.role === 'host' ? 0 : P.players.findIndex(p => p.name.toLowerCase() === O.name.toLowerCase());
  if (O.me < 0){ onlineFail('Ya no estás en esta sala.', false, 'No se ha podido entrar'); return; }
  S.online = true;
  S.game = { players:P.players.map((p, i) => ({ name:p.name, score:p.score, off:!p.connected, me:i === O.me })), plan:P.plan, idx:P.idx, history:P.history, letterTurns:0 };
  if (first && O.role === 'guest') requestWake();
  $('#quit-btn').hidden = false;
  renderScores(P.phase === 'choose' ? P.chooser : -1);
  if (P.screen === O.screen){ const el = $('#o-wait-list'); if (el) el.textContent = waitingNames(P); return; }
  O.screen = P.screen;
  stopClock();
  S.round = { type: P.round ? P.round.type : P.plan[P.idx] };
  switch (P.phase){
    case 'lobby': return onlineLobby(P, !prevScreen.startsWith('lobby'));
    case 'choose': return onlineChoose(P);
    case 'play': return onlinePlay(P);
    case 'results': return onlineResults(P);
    case 'final': return onlineFinal(P);
  }
}
function onlineLobby(P, focus){
  const host = O.role === 'host', link = roomLink(P.code), set = P.settings;
  const kindTxt = { alternas:'letras y cifras', letras:'solo letras', cifras:'solo cifras' }[set.kind];
  const timeTxt = { oficial:'con el tiempo del concurso', doble:'con el doble de tiempo', libre:'sin límite de tiempo' }[set.time];
  const online = P.players.filter(p => p.connected).length;
  app.innerHTML = `<section aria-labelledby="h-lobby">
    <h2 id="h-lobby">Sala ${esc(P.code)}</h2>
    <p class="lead">${host ? 'Tus amigos tienen que abrir el juego, elegir «Varios móviles», «Unirme a una sala» y escribir este código. También puedes mandarles el enlace.' : 'Ya estás dentro. Espera a que el anfitrión empiece la partida.'}</p>
    <div class="room-code" role="img" aria-label="Código de la sala: ${P.code.split('').join(' ')}">${P.code.split('').map(c => `<span class="tile">${c}</span>`).join('')}</div>
    ${host ? `<div class="row"><button type="button" class="btn" id="o-copy">Copiar enlace</button>${navigator.share ? '<button type="button" class="btn" id="o-share">Compartir</button>' : ''}</div>` : ''}
    <h3>Jugadores conectados: ${online}</h3>
    <ul class="plist">${P.players.map((p, i) => `<li><span class="nm">${esc(p.name)}${i === O.me ? ' (tú)' : ''}</span>${i === 0 ? '<span class="badge neutral">Anfitrión</span>' : ''}${p.connected ? '' : '<span class="badge bad">Sin conexión</span>'}</li>`).join('')}</ul>
    <p class="hint">Partida de ${set.rounds} pruebas: ${kindTxt}, ${timeTxt}.</p>
    ${host ? `<p class="msg" id="o-startmsg" role="status">${online < 2 ? 'Hacen falta al menos 2 jugadores para empezar.' : ''}</p><button type="button" class="btn primary" id="o-start" ${online < 2 ? 'aria-disabled="true"' : ''}>Empezar partida</button>` : ''}
  </section>`;
  if (host){
    $('#o-copy').addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText(link); $('#o-copy').textContent = 'Enlace copiado'; announce('Enlace copiado.'); }
      catch(_){ window.prompt('Copia este enlace:', link); }
    });
    const sh = $('#o-share'); if (sh) sh.addEventListener('click', () => { navigator.share({ title:'Cifras y Letras', text:`Sala ${P.code}`, url:link }).catch(() => {}); });
    $('#o-start').addEventListener('click', () => {
      if (O.P.players.filter(p => p.connected).length < 2){ $('#o-startmsg').textContent = 'Hacen falta al menos 2 jugadores para empezar.'; return; }
      onlineSend({ t:'start' });
    });
  }
  if (focus) focusHeading();
}
function onlineChoose(P){
  const me = O.me, ch = P.chooser, host = O.role === 'host', cname = P.players[ch].name;
  const mine = ch === me || (host && !P.players[ch].connected);
  app.innerHTML = `<section class="round-l" aria-labelledby="h-round">
    ${roundHead()}
    <p class="turn-msg">${mine ? (ch === me ? '¿Cuántas vocales queréis?' : `<strong>${esc(cname)}</strong> no está conectado. Elige tú las vocales.`) : `Elige <strong>${esc(cname)}</strong>: ¿cuántas vocales?`}</p>
    ${mine ? `<div class="pick" role="group" aria-label="Número de vocales">${[3,4,5,6].map(n => `<button type="button" class="btn" data-v="${n}" aria-label="${n} vocales">${n}</button>`).join('')}</div>
      <div class="row"><button type="button" class="btn small" data-v="azar">Al azar</button></div>
      <p class="hint" style="margin-top:14px">Saldrán 10 letras: las vocales que elijas y el resto consonantes.</p>` : '<p class="hint">Esperando a que elija.</p>'}
  </section>`;
  $$('[data-v]', app).forEach(b => b.addEventListener('click', () => {
    onlineSend({ t:'vowels', n: b.dataset.v === 'azar' ? [3,4,4,5,5,6][rnd(6)] : +b.dataset.v });
  }));
  focusHeading();
  announce(mine ? 'Te toca elegir las vocales.' : `Elige ${cname}.`);
}
function onlinePlay(P){
  const R = P.round, mine = !!P.submitted[O.me];
  const pr = { secs:R.secs, deadlineAt: Date.now() + R.remaining, instant:mine, submitted:mine };
  if (R.type === 'L') letrasDeal(R.vowels, Object.assign(pr, { letters:R.letters }));
  else cifrasDeal(Object.assign(pr, { nums:R.nums, target:R.target }));
}
const lockTiles = () => $$('#tiles .tile').forEach(t => { t.disabled = true; });
function clockLeft(pr){ return pr.secs ? Math.min(pr.secs * 1000, pr.deadlineAt - Date.now()) : undefined; }
function onlineLetrasPlay(pr){
  if (pr.submitted){ lockTiles(); onlineWaiting(); return; }
  const scr = O.screen;
  letrasInput({ secs:pr.secs, left:clockLeft(pr), noPause:true, onDone: w => {
    onlineSend({ t:'answer', k:'L', word:w }); lockTiles();
    if (O.screen === scr) onlineWaiting();
  } });
}
function onlineCifrasPlay(pr){
  if (pr.submitted){ $('#tiles').hidden = false; onlineWaiting(); return; }
  const scr = O.screen;
  cifrasInput({ secs:pr.secs, left:clockLeft(pr), noPause:true, onDone: a => {
    onlineSend({ t:'answer', k:'C', ans: a ? { value:a.value, steps:a.steps.map(s => ({ a:s.a, b:s.b, op:s.op, r:s.r })) } : null });
    $('#tiles').hidden = false;
    if (O.screen === scr) onlineWaiting();
  } });
}
function onlineWaiting(){
  const P = O.P, host = O.role === 'host';
  const ch = $('#clock-host'); if (ch) ch.innerHTML = '';
  $('#play').innerHTML = `<div class="panel" role="status"><h3 id="o-wait-h" tabindex="-1">Respuesta enviada</h3>
    <p id="o-wait-list">${esc(waitingNames(P))}</p>
    ${host ? '<button type="button" class="btn" id="o-force">Cerrar la prueba ya</button>' : ''}</div>`;
  if (host) $('#o-force').addEventListener('click', () => onlineSend({ t:'force' }));
  $('#o-wait-h').focus();
}
function staticBoard(R){
  if (R.type === 'L') return `<ul class="tiles letters" aria-label="Letras">${R.letters.map(l => `<li><span class="tile">${l.toUpperCase()}</span></li>`).join('')}</ul>
    <p class="hint" style="margin-top:10px">${R.vowels} vocales y ${10 - R.vowels} consonantes.</p>`;
  return `<ul class="tiles numbers" aria-label="Números">${R.nums.map(n => `<li><span class="tile">${n}</span></li>`).join('')}</ul>
    <div class="target"><span>Objetivo</span><div class="tile">${R.target}</div></div>`;
}
function onlineResults(P){
  const scr = O.screen, host = O.role === 'host', R = P.round, res = P.results;
  const last = P.idx >= P.plan.length - 1;
  const footer = host
    ? `<div class="row next-row"><button type="button" class="btn primary" id="o-next">${last ? 'Ver la clasificación final' : 'Siguiente prueba'}</button></div>`
    : `<p class="hint" style="margin-top:18px">Esperando a que ${esc(P.players[0].name)} pase ${last ? 'a la clasificación final' : 'a la siguiente prueba'}.</p>`;
  const draw = () => {
    if (O.screen !== scr) return;
    const inner = R.type === 'L'
      ? letrasResultsHtml(P.players, res.answers, res.pts, res.best, { who:'Jugador', canOverride:host, footer })
      : cifrasResultsHtml(P.players, res.answers, res.pts, res.sol, R.target, { who:'Jugador', footer });
    app.innerHTML = `<section class="round-${R.type === 'L' ? 'l' : 'c'}" aria-labelledby="h-round">${roundHead()}
      <div class="board"><div class="clock-col"></div><div class="board-main">${staticBoard(R)}</div></div>${inner}</section>`;
    $$('[data-ov]').forEach(btn => btn.addEventListener('click', () => { O.focusSel = `[data-ov="${btn.dataset.ov}"]`; onlineSend({ t:'override', i:+btn.dataset.ov }); }));
    if (host) $('#o-next').addEventListener('click', () => onlineSend({ t:'next' }));
    if (O.focusSel){ const el = $(O.focusSel); O.focusSel = null; if (el) el.focus(); }
    else {
      $('#res-h').focus();
      const sum = resumenEquipos(res.pts);
      announce(R.type === 'L' ? `${sum} La palabra más larga posible tenía ${res.best.len} letras.` : `${sum} ${res.sol.diff === 0 ? 'La cifra exacta era posible.' : `Lo más cerca posible era ${res.sol.value}.`}`);
    }
  };
  if (R.type === 'L' && !Dict.variants) loadDict().then(draw).catch(draw); else draw();
}
function onlineFinal(P){
  const host = O.role === 'host';
  const { html, headline } = finalHtml(S.game, host
    ? '<div class="row"><button type="button" class="btn primary" id="o-again">Otra partida en esta sala</button></div>'
    : `<p class="hint">Esperando a que ${esc(P.players[0].name)} abra otra partida. Puedes salir cuando quieras.</p>`);
  app.innerHTML = html;
  if (host) $('#o-again').addEventListener('click', () => onlineSend({ t:'restart' }));
  focusHeading(); announce(headline);
}


/* ================= Salir ================= */
$('#quit-btn').addEventListener('click', () => {
  const d = $('#dlg-quit'), online = !!S.online;
  const wasRunning = !online && S.clock && S.clock.running;
  if (wasRunning) S.clock.pause();
  $('#dlg-quit-p').textContent = online
    ? (O.role === 'host' ? 'Se cerrará la sala para todos los jugadores.' : 'Saldrás de la sala. Podrás volver a entrar con el mismo nombre.')
    : 'Se perderá la puntuación de esta partida.';
  d.returnValue = '';
  d.onclose = () => {
    if (d.returnValue === 'ok'){ if (online) onlineLeave(); renderSetup(); }
    else if (wasRunning && S.clock) S.clock.start();
  };
  if (typeof d.showModal === 'function') d.showModal();
  else if (confirm('¿Salir de la partida?')){ if (online) onlineLeave(); renderSetup(); }
});


/* ================= Arranque ================= */
window.addEventListener('hashchange', () => { if (!S.online && $('#f-setup')) renderSetup(); });
renderSetup();
loadDict().then(() => {
  const st = $('#dict-status'); if (st) st.textContent = `Diccionario listo: ${fmt(Dict.count)} palabras de 5 a 10 letras.`;
}).catch(() => {
  const st = $('#dict-status'); if (st) st.textContent = 'No se ha podido preparar el diccionario en este navegador. Prueba con una versión más reciente.';
});
</script>
